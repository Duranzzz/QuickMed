# azure-pipelines.yml
# Pipeline CI/CD para Flutter con tests

trigger:
- main

pool:
  name: Default

steps:
# PASO 1: Instalar dependencias
- script: flutter pub get
  displayName: 'Pub Get'

# PASO 2: Ejecutar tests y generar reporte JUnit
- script: |
    flutter test --machine > test-results.json
    dart run junitreport:tojunit --input test-results.json --output test-results.xml
  displayName: 'Ejecutar Tests'
  continueOnError: true

# PASO 3: Publicar resultados en Azure DevOps
- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/test-results.xml'
    mergeTestResults: true
    testRunTitle: 'Flutter Tests'
  condition: succeededOrFailed()

# PASO 4: Compilar APK solo si los tests pasan
- script: flutter build apk --release
  displayName: 'Build APK Release'
  condition: succeeded()

# PASO 5: Publicar APK en Artifacts
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'build/app/outputs/flutter-apk/app-release.apk'
    ArtifactName: 'apk-release'
    publishLocation: 'Container'
  displayName: 'Publicar APK en Artifacts'