# azure-pipelines.yml
# Este archivo define el pipeline de CI/CD para compilar Flutter

resources:
  repositories:
    - repository: self
      type: github
      endpoint: github.com_Duranzzz    # Tu conexión a GitHub
      name: Duranzzz/QuickMed          # usuario/repo

trigger:
- main                                # Se ejecuta al hacer push a main

pool:
  name: Default                        # Tu agente self-hosted (tu PC)

steps:
# PASO 1: Instalar dependencias de Flutter
- script: flutter pub get
  displayName: 'Pub Get'

# PASO 2: Compilar APK en modo release
- script: flutter build apk --release
  displayName: 'Build APK Release'

# PASO 3: Publicar el APK en Artifacts de Azure DevOps
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'build/app/outputs/flutter-apk/app-release.apk'  # Ruta confirmada
    ArtifactName: 'apk-release'
    publishLocation: 'Container'  # Se guarda en Azure DevOps (nube)
  displayName: 'Publicar APK en Artifacts'